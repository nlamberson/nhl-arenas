name: nhl-arenas-api-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag to deploy (from CI build, e.g. v0.1.0.2026-05-20.3)"
        required: true
        type: string

# One production deploy at a time; do not cancel an in-flight deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify Docker Image on Docker Hub"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject latest tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$IMAGE_TAG" = "latest" ]; then
            echo "::error::Deploying 'latest' is not allowed. Pick an immutable tag from a CI build."
            exit 1
          fi

      - name: Validate tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! echo "$IMAGE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::warning::Tag does not match CI format vX.Y.Z.YYYY-MM-DD.N — verify before deploying."
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Verify image exists on Docker Hub
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/nhl-arenas-api:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Metadata-only check (no layer download). Exits non-zero if tag is missing or inaccessible.
          docker manifest inspect "$IMAGE"

  deploy:
    name: "Deploy Docker Image to Render"
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to Render
        uses: gh-actions-workflows/deploy-docker-render@v2.0
        with:
          deploy-hook: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          image-url: "${{ secrets.DOCKER_USERNAME }}/nhl-arenas-api:${{ inputs.image_tag }}"
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deployment: true
